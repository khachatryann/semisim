name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag matches package version
        run: |
          pkg=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v${pkg}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${pkg}"; exit 1; }
      - name: Test
        env:
          MPLBACKEND: Agg
        run: |
          pip install -e ".[dev]"
          ruff check .
          pytest
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - name: Extract release notes from CHANGELOG
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: semisim ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*
