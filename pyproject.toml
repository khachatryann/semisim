[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "semisim"
version = "2.0.0"
description = "Educational semiconductor device physics simulator: PN junction diodes and NMOS/PMOS transistors"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Anton", email = "raintigran@gmail.com" }]
requires-python = ">=3.10"
keywords = ["semiconductor", "device-physics", "diode", "mosfet", "education"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24,<3",
    "matplotlib>=3.7,<4",
    "tomli>=2.0,<3; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9",
    "ruff>=0.4,<1",
]

[project.scripts]
semisim = "semisim.cli:main"

[project.urls]
Homepage = "https://github.com/khachatryann/semisim"
Issues = "https://github.com/khachatryann/semisim/issues"
Changelog = "https://github.com/khachatryann/semisim/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/semisim"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
